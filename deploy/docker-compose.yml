version: "3.9"

services:
  db:
    image: mysql:8.0
    env_file: ../.env
    environment:
      TZ: Asia/Tokyo
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    volumes:
      - ..:/rails
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
    command: bash -c "bundle exec rails s -b 0.0.0.0"

volumes:
  db-data:
